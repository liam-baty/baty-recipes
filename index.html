<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app use the full iPhone screen; we add safe-area padding in CSS -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baty Recipes</title>

  <!-- Keep search engines away (see also robots.txt). The site is still public to anyone with the link. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- Installable app (PWA) settings -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2f6b4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baty Recipes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">

  <!-- Apply the saved theme and text size before the page draws, so there is no flash -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('baty.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      if (s.textSize) document.documentElement.dataset.text = s.textSize;
    } catch (e) { /* storage blocked: defaults are fine */ }
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>

  <!-- Each page ("view") is drawn into here by js/app.js -->
  <main id="view" tabindex="-1">
    <p class="loading">Loading recipes…</p>
  </main>

  <!-- Running timers float above the tab bar on every page -->
  <div id="timer-tray" class="timer-tray" aria-live="polite" hidden></div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Recipes</span></a>
    <a href="#/plan" data-tab="plan"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span>Meal plan</span></a>
    <a href="#/shopping" data-tab="shopping"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h11.1L21 7H6.3"/><circle cx="9" cy="19.5" r="1.6"/><circle cx="17" cy="19.5" r="1.6"/></svg><span>Shopping</span><b class="badge" id="shop-count" hidden></b></a>
    <a href="#/settings" data-tab="settings"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Full-screen alert shown when a timer finishes -->
  <div id="alarm" class="alarm" role="alertdialog" aria-labelledby="alarm-title" hidden>
    <div class="alarm-box">
      <p class="alarm-icon" aria-hidden="true">⏰</p>
      <h2 id="alarm-title">Time's up!</h2>
      <p id="alarm-text"></p>
      <button class="btn primary big" id="alarm-stop">Stop alarm</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
